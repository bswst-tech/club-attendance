<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ระบบเช็คชื่อกิจกรรมชุมนุม — โรงเรียนบ้านสวนวิทยาคม</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.x/dist/tabler-icons.min.css">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
:root{
  --blue-50:#f0f8fc;--blue-100:#cbe8f2;--blue-400:#4dadd0;
  --blue-600:#2980b9;--blue-800:#1a5c85;
  --green-100:#d1f0e0;--green-600:#1d6b45;
  --yellow-100:#fff6c3;--yellow-200:#ffe980;--yellow-800:#7a5c00;
  --red-100:#fde8e8;--red-600:#e53e3e;
  --orange-100:#fff3e0;--orange-600:#e65c00;
  --gray-100:#f1f5f9;--gray-400:#94a3b8;--gray-600:#475569;--gray-800:#1e293b;
  --radius:10px;--shadow:0 2px 12px rgba(41,128,185,.10);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Sarabun",sans-serif;background:var(--blue-50);color:var(--gray-800);min-height:100vh;display:flex;flex-direction:column}
.topbar{background:var(--blue-600);color:#fff;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;position:sticky;top:0;z-index:50;box-shadow:var(--shadow)}
.topbar-brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px}
.tlogo{width:40px;height:40px;border-radius:50%;background:#fff;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.35)}
.tlogo img{width:100%;height:100%;object-fit:cover}
.chip-user{background:rgba(255,255,255,.15);border-radius:20px;padding:4px 14px;font-size:13px}
.nav-wrap{background:#fff;border-bottom:2px solid var(--blue-100);padding:0 1.5rem;position:sticky;top:60px;z-index:40;overflow-x:auto;white-space:nowrap}
.nav-btn{display:inline-flex;align-items:center;gap:6px;padding:12px 16px;border:none;background:none;font-family:inherit;font-size:14px;color:var(--gray-400);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.2s}
.nav-btn:hover{color:var(--blue-600)}
.nav-btn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600}
.main-content{flex:1}
.container{padding:1.5rem;max-width:1100px;margin:0 auto}
@media(max-width:600px){.container{padding:1rem}}
.card{background:#fff;border-radius:var(--radius);border:1.5px solid var(--blue-100);padding:1.25rem;box-shadow:var(--shadow)}
.card+.card{margin-top:1rem}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 18px;border-radius:var(--radius);font-size:14px;font-family:inherit;cursor:pointer;border:1.5px solid var(--gray-400);background:#fff;color:var(--gray-800);font-weight:500;transition:.15s;white-space:nowrap}
.btn:hover{opacity:.85}
.btn-blue{background:var(--blue-600);color:#fff;border-color:var(--blue-600)}
.btn-green{background:var(--green-600);color:#fff;border-color:var(--green-600)}
.btn-red{background:var(--red-600);color:#fff;border-color:var(--red-600)}
.btn-yellow{background:var(--yellow-100);color:var(--yellow-800);border-color:var(--yellow-200)}
.btn-sm{padding:5px 12px;font-size:12px}
.form-group{margin-bottom:.85rem}
.form-group label{font-size:13px;color:var(--gray-600);display:block;margin-bottom:5px;font-weight:500}
input,select,textarea{width:100%;padding:9px 12px;border:1.5px solid var(--blue-100);border-radius:var(--radius);font-size:14px;font-family:inherit;background:#fff;color:var(--gray-800);transition:.15s}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--blue-400);box-shadow:0 0 0 3px rgba(77,173,208,.15)}
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
thead th{background:var(--blue-100);color:var(--blue-800);font-weight:600;padding:10px 12px;text-align:left;font-size:12px;white-space:nowrap}
tbody tr{border-bottom:1px solid var(--blue-50)}
tbody tr:hover{background:var(--blue-50)}
td{padding:9px 12px;vertical-align:middle}
.td-actions{display:flex;gap:5px;justify-content:flex-end;flex-wrap:wrap}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:600}
.badge-green{background:var(--green-100);color:var(--green-600)}
.badge-red{background:var(--red-100);color:var(--red-600)}
.badge-yellow{background:var(--yellow-100);color:var(--yellow-800)}
.badge-orange{background:var(--orange-100);color:var(--orange-600)}
.badge-blue{background:var(--blue-100);color:var(--blue-800)}
.badge-gray{background:var(--gray-100);color:var(--gray-600)}
.status-btn{padding:5px 12px;border-radius:8px;border:1.5px solid var(--gray-400);background:#fff;font-size:12px;font-family:inherit;cursor:pointer;font-weight:500;transition:.15s}
.s-present{background:var(--green-100);color:var(--green-600);border-color:var(--green-600)}
.s-absent{background:var(--red-100);color:var(--red-600);border-color:var(--red-600)}
.s-late{background:var(--orange-100);color:var(--orange-600);border-color:var(--orange-600)}
.s-leave{background:var(--yellow-100);color:var(--yellow-800);border-color:var(--yellow-200)}
.search-box{position:relative}
.search-box i{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--gray-400);pointer-events:none}
.search-box input{padding-left:36px}
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:1.25rem;flex-wrap:wrap;gap:.5rem}
.text-muted{color:var(--gray-400);font-size:12px}
.loading{text-align:center;padding:2.5rem;color:var(--gray-400)}
.empty{text-align:center;padding:2.5rem;color:var(--gray-400)}
h2{font-size:17px;font-weight:600;margin-bottom:1rem}
h3{font-size:15px;font-weight:600;margin-bottom:.6rem}
.login-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--blue-100) 0%,var(--green-100) 100%)}
.login-card{background:#fff;border-radius:16px;padding:2rem 1.75rem;width:340px;box-shadow:0 4px 24px rgba(41,128,185,.15);border:1.5px solid var(--blue-100)}
.club-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1rem}
.club-card{background:#fff;border:1.5px solid var(--blue-100);border-radius:var(--radius);padding:1rem 1.25rem;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
.club-card:hover{background:var(--blue-50);border-color:var(--blue-400);transform:translateY(-2px)}
.club-card .club-name{font-size:14px;font-weight:700;color:var(--blue-800);margin-bottom:4px}
.club-card .club-teacher{font-size:12px;color:var(--gray-600)}
.stat-row{display:flex;gap:.75rem;margin-bottom:1rem;flex-wrap:wrap}
.stat-box{background:#fff;border:1.5px solid var(--blue-100);border-radius:var(--radius);padding:.75rem 1rem;flex:1;min-width:70px;text-align:center}
.stat-num{font-size:22px;font-weight:700}
.stat-label{font-size:11px;color:var(--gray-400)}
.footer{background:var(--blue-800);color:rgba(255,255,255,.75);text-align:center;padding:1rem 1.5rem;font-size:12px;line-height:1.8}
.footer strong{color:#fff}
.tab-bar{display:flex;gap:4px;border-bottom:2px solid var(--blue-100);margin-bottom:1rem;overflow-x:auto}
.tbtn{padding:8px 14px;border:none;background:none;font-family:inherit;font-size:13px;color:var(--gray-400);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px;white-space:nowrap;transition:.15s}
.tbtn.active{color:var(--blue-600);border-bottom-color:var(--blue-600);font-weight:600}
.tc{display:none}.tc.active{display:block}
.activity-box{background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1rem}
.activity-box label{font-size:13px;font-weight:600;color:var(--blue-800);display:block;margin-bottom:.4rem}
.swal2-popup{font-family:"Sarabun",sans-serif!important;border-radius:14px!important}
.swal2-confirm,.swal2-cancel{border-radius:var(--radius)!important}
</style>
</head>

function G(id) { return document.getElementById(id); }

function escH(s) { return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function todayKey() {
  var d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
}
function makeId(no, cls) { return String(no).padStart(3,"0") + "_" + String(cls).replace(/[^a-zA-Z0-9ก-๙]/g,""); }
function toast(icon, title, txt) {

function stBadge(s) {

// ══ LOGIN ══
function doLogin() {
  var u = G("loginUser").value.trim();
  var p = G("loginPass").value.trim();
  if (!u || !p) { toast("warning","กรุณากรอกข้อมูลให้ครบ"); return; }
  var usr = USERS[u];
  if (!usr || usr.password !== p) {
    Swal.fire({ icon:"error", title:"เข้าสู่ระบบไม่สำเร็จ", text:"ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง", confirmButtonColor:"#2980b9" });
    return;
  }
  APP.user = u;
  APP.displayName = usr.displayName;
  APP.isAdmin = !!usr.isAdmin;

  // ── popup เข้าสู่ระบบสำเร็จ ──
  Swal.fire({
    icon: "success",
    title: "เข้าสู่ระบบสำเร็จ",
    text: "ยินดีต้อนรับ " + usr.displayName,
    confirmButtonColor: "#2980b9",
    timer: 1800,
    timerProgressBar: true
  }).then(function() { startApp(); });
}

function doLogout() {

  G("loginScreen").style.display = "flex";

  G("loginPass").value = "";
}

function buildNav() {
  var tabs = APP.isAdmin
    ? [["clubs","ชุมนุม","ti-users"],["students","รายชื่อนักเรียน","ti-address-book"],["attendance","เช็คชื่อ","ti-check"],["report","รายงาน","ti-chart-bar"]]
    : [["attendance","เช็คชื่อ","ti-check"],["members","สมาชิก","ti-user-plus"],["report","รายงาน","ti-chart-bar"]];
  G("mainNav").innerHTML = tabs.map(function(t, i) {
    return "<button class='nav-btn" + (i===0?" active":"") + "' data-page='" + t[0] + "'><i class='ti " + t[2] + "'></i> " + t[1] + "</button>";
  }).join("");
  G("mainNav").querySelectorAll(".nav-btn").forEach(function(btn) {
    btn.addEventListener("click", function() { navGo(btn.getAttribute("data-page")); });
  });
}

function navGo(page) {
  G("mainNav").querySelectorAll(".nav-btn").forEach(function(b) {
    b.classList.toggle("active", b.getAttribute("data-page") === page);
  });
  if (page === "clubs")      renderAllClubs();
  else if (page === "students")   renderStudentDB();
  else if (page === "attendance") renderAttendance();
  else if (page === "members")    renderMembers();
  else if (page === "report")     renderReport();
}

// ══ PICK CLUB (ครูหลายชุมนุม) ══
function pickClubFirst() {
  var mc = myClubs();
  var opts = mc.map(function(cid) {
    return "<option value='" + cid + "'>" + CLUBS[cid].name + "</option>";
  }).join("");
  Swal.fire({
    title: "เลือกชุมนุมของท่าน",
    html: "<select id='pickClub' style='font-family:Sarabun;width:100%;padding:10px 12px;border:1.5px solid #cbe8f2;border-radius:10px;font-size:14px'>" + opts + "</select>",
    confirmButtonText: "เลือก", confirmButtonColor: "#2980b9",
    allowOutsideClick: false, allowEscapeKey: false,
    preConfirm: function() { return document.getElementById("pickClub").value; }
  }).then(function(r) {
    if (r.isConfirmed) { APP.clubId = r.value; navGo("attendance"); }
  });
}

// ══ ADMIN: ALL CLUBS ══
function renderAllClubs() {
  var h = "<div class='container'><div class='section-header'><h2 style='margin:0'>ชุมนุมทั้งหมด</h2><div class='text-muted'>คลิกเพื่อเลือกเช็คชื่อ</div></div><div class='club-grid'>";

         "<div style='font-size:11px;color:var(--gray-400);margin-bottom:2px'>" + cid.replace("club","ชุมนุม ") + "</div>" +
         "<div class='club-name'>" + escH(c.name) + "</div>" +

  });
  h += "</div></div>";

}

// ══ ADMIN: STUDENT DATABASE ══
function renderStudentDB() {
  showPage("<div class='container'><div class='loading'>กำลังโหลด...</div></div>");
  db.ref("students").once("value").then(function(snap) {
    var students = [];
    if (snap.exists()) snap.forEach(function(c) {
      var d = c.val();
      students.push({ id:c.key, no:d.no, name:d.name, class:d.class });
    });
    students.sort(function(a,b) { return String(a.class).localeCompare(String(b.class)) || Number(a.no)-Number(b.no); });

    var classMap = {};
    students.forEach(function(s) {
      if (!classMap[s.class]) classMap[s.class] = [];
      classMap[s.class].push(s);
    });
    var classes = Object.keys(classMap).sort();

    var h = "<div class='container'>";
    h += "<div class='section-header'><div><h2 style='margin:0'>ฐานข้อมูลนักเรียน</h2><div class='text-muted'>" + students.length + " คน จาก " + classes.length + " ห้อง</div></div>";
    h += "<div style='display:flex;gap:.5rem;flex-wrap:wrap'>";
    h += "<button class='btn btn-yellow' id='btnImportDB'><i class='ti ti-file-spreadsheet'></i> นำเข้า Excel</button>";
    h += "<button class='btn btn-red' id='btnClearDB'><i class='ti ti-trash'></i> ล้างข้อมูลทั้งหมด</button>";
    h += "</div></div>";

    if (students.length === 0) {
      h += "<div class='card'><div class='empty'><i class='ti ti-users' style='font-size:36px;color:var(--blue-200)'></i><br><br>ยังไม่มีข้อมูลนักเรียน<br><span class='text-muted'>กรุณานำเข้าจาก Excel</span></div></div>";
    } else {
      h += "<div class='card'><div class='tab-bar'>";
      classes.forEach(function(cls, i) {
        h += "<button class='tbtn" + (i===0?" active":"") + "' id='stab_" + i + "' data-cls='" + escH(cls) + "'>" + escH(cls) + " (" + classMap[cls].length + ")</button>";
      });
      h += "</div>";
      classes.forEach(function(cls, i) {
        h += "<div class='tc" + (i===0?" active":"") + "' id='stc_" + i + "'><div class='table-wrap'><table>";
        h += "<thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th></tr></thead><tbody>";
        classMap[cls].forEach(function(s) {
          h += "<tr><td>" + s.no + "</td><td>" + escH(s.name) + "</td><td>" + escH(s.class) + "</td></tr>";
        });
        h += "</tbody></table></div></div>";
      });
      h += "</div>";
    }
    h += "</div>";
    showPage(h);

    G("btnImportDB").addEventListener("click", openImportStudentDB);
    G("btnClearDB").addEventListener("click", function() {
      Swal.fire({
        icon:"warning", title:"ล้างข้อมูลนักเรียนทั้งหมด?",
        text:"ข้อมูลสมาชิกชุมนุมและการเช็คชื่อจะยังคงอยู่",
        confirmButtonText:"ล้างข้อมูล", confirmButtonColor:"#e53e3e",
        showCancelButton:true, cancelButtonText:"ยกเลิก"
      }).then(function(r) {
        if (!r.isConfirmed) return;
        db.ref("students").remove().then(function() {
          toast("success","ล้างข้อมูลสำเร็จ");
          renderStudentDB();
        });
      });
    });
    // Tab events
    classes.forEach(function(cls, i) {
      var btn = G("stab_" + i);
      if (!btn) return;
      btn.addEventListener("click", function() {
        document.querySelectorAll(".tbtn").forEach(function(b){ b.classList.remove("active"); });
        document.querySelectorAll(".tc").forEach(function(t){ t.classList.remove("active"); });
        btn.classList.add("active");
        G("stc_" + i).classList.add("active");
      });
    });
  });
}

function openImportStudentDB() {
  Swal.fire({
    title: "นำเข้ารายชื่อนักเรียน (ฐานข้อมูลกลาง)",
    html: "<div style='text-align:left'>" +
      "<div style='background:var(--blue-50);border:1.5px solid var(--blue-100);border-radius:10px;padding:.75rem;font-size:13px;margin-bottom:1rem'>" +
      "คอลัมน์ A = เลขที่ | B = ชื่อ-นามสกุล | C = ห้อง<br>แถวแรก = หัวตาราง</div>" +
      "<input type='file' id='xlDB' accept='.xlsx,.xls' style='font-family:Sarabun;width:100%'>" +
      "<div id='xlDBprev' style='margin-top:.75rem;font-size:13px'></div></div>",
    confirmButtonText: "นำเข้า", confirmButtonColor: "#2980b9",
    showCancelButton: true, cancelButtonText: "ยกเลิก",
    didOpen: function() {
      G("xlDB").addEventListener("change", function(e) {
        var file = e.target.files[0]; if (!file) return;
        var reader = new FileReader();
        reader.onload = function(ev) {
          try {
            var wb = XLSX.read(ev.target.result, { type:"binary" });
            var ws = wb.Sheets[wb.SheetNames[0]];
            var data = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
            var rows = data.slice(1).filter(function(r){ return r[0]&&r[1]&&r[2]; });
            G("xlDBprev").innerHTML = "พบ <strong style='color:var(--blue-600)'>" + rows.length + " คน</strong>";
            G("xlDB")._rows = rows;
          } catch(err) {
            G("xlDBprev").innerHTML = "<span style='color:var(--red-600)'>อ่านไฟล์ไม่ได้</span>";
          }
        };
        reader.readAsBinaryString(file);
      });
    },
    preConfirm: function() {
      var rows = G("xlDB")._rows;
      if (!rows || !rows.length) { Swal.showValidationMessage("กรุณาเลือกไฟล์"); return false; }
      return rows;
    }
  }).then(function(r) {
    if (!r.isConfirmed) return;
    Swal.fire({ title:"กำลังนำเข้า...", allowOutsideClick:false, didOpen:function(){ Swal.showLoading(); } });
    db.ref("students").remove().then(function() {
      var updates = {};
      r.value.forEach(function(row) {
        var no = String(row[0]).trim(), name = String(row[1]).trim(), cls = String(row[2]).trim();
        if (!no||!name||!cls) return;
        updates["students/" + makeId(no,cls)] = { no:Number(no), name:name, class:cls };
      });
      return db.ref().update(updates);
    }).then(function() {
      Swal.close();
      Swal.fire({ icon:"success", title:"นำเข้าสำเร็จ", text:"นักเรียน " + r.value.length + " คน", confirmButtonColor:"#2980b9" });
      renderStudentDB();
    }).catch(function(e) { Swal.close(); toast("error","เกิดข้อผิดพลาด",e.message); });
  });
}

// ══ MEMBERS (ครูเลือกสมาชิกจากฐานข้อมูลกลาง) ══
function renderMembers() {
  if (!APP.clubId) { pickClubFirst(); return; }
  var cid = APP.clubId;
  showPage("<div class='container'><div class='loading'>กำลังโหลด...</div></div>");

  // โหลดทั้ง members ของชุมนุม และ students ฐานข้อมูลกลาง
  Promise.all([
    db.ref("clubs/" + cid + "/members").once("value"),
    db.ref("students").once("value")
  ]).then(function(results) {
    var memSnap = results[0], stuSnap = results[1];
    var members = [];
    if (memSnap.exists()) memSnap.forEach(function(c) {
      var d = c.val(); members.push({ id:c.key, no:d.no, name:d.name, class:d.class });
    });
    members.sort(function(a,b){ return Number(a.no)-Number(b.no); });

    // ฐานข้อมูลนักเรียนกลาง
    var allStudents = [];
    if (stuSnap.exists()) stuSnap.forEach(function(c) {
      var d = c.val(); allStudents.push({ id:c.key, no:d.no, name:d.name, class:d.class });
    });
    var allClasses = [];
    var seen = {};
    allStudents.forEach(function(s) { if (!seen[s.class]) { seen[s.class] = true; allClasses.push(s.class); } });
    allClasses.sort();

    var memberIds = {};
    members.forEach(function(m) { memberIds[m.id] = true; });

    var h = "<div class='container'>";
    h += "<div class='section-header'>";
    h += "<div><h2 style='margin:0'>สมาชิก: " + escH(CLUBS[cid].name) + "</h2><div class='text-muted'>" + members.length + " คน</div></div>";
    h += "</div>";

    // เพิ่มสมาชิกจากฐานข้อมูลกลาง
    if (allStudents.length > 0) {
      h += "<div class='card' style='margin-bottom:1rem'>";
      h += "<h3><i class='ti ti-user-plus'></i> เพิ่มสมาชิกจากฐานข้อมูล</h3>";
      h += "<div style='display:flex;gap:.75rem;flex-wrap:wrap;align-items:flex-end'>";
      h += "<div style='flex:1;min-width:130px'><label style='font-size:13px;font-weight:500;display:block;margin-bottom:4px'>เลือกชั้นเรียน</label>";
      h += "<select id='selCls' style='font-family:Sarabun'><option value=''>-- เลือกชั้น --</option>";
      allClasses.forEach(function(cls){ h += "<option>" + escH(cls) + "</option>"; });
      h += "</select></div>";
      h += "<div style='flex:2;min-width:180px'><label style='font-size:13px;font-weight:500;display:block;margin-bottom:4px'>เลือกนักเรียน</label>";
      h += "<select id='selStu' style='font-family:Sarabun'><option value=''>-- เลือกนักเรียน --</option></select></div>";
      h += "<button class='btn btn-blue' id='btnAddFromDB' style='flex-shrink:0'><i class='ti ti-plus'></i> เพิ่ม</button>";
      h += "</div></div>";
    } else {
      h += "<div style='background:var(--yellow-100);border:1.5px solid var(--yellow-200);border-radius:var(--radius);padding:.75rem 1rem;font-size:13px;color:var(--yellow-800);margin-bottom:1rem'>⚠️ ยังไม่มีฐานข้อมูลนักเรียน — แอดมินต้องนำเข้าก่อน</div>";
    }

    h += "<div class='search-box' style='margin-bottom:1rem'><i class='ti ti-search'></i><input id='memSearch' placeholder='ค้นหาชื่อ...'></div>";
    h += "<div class='card' style='padding:0'><div class='table-wrap'><table id='memTbl'>";
    h += "<thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th style='text-align:right'>จัดการ</th></tr></thead><tbody>";
    if (!members.length) {
      h += "<tr><td colspan='4' style='text-align:center;padding:2rem;color:var(--gray-400)'>ยังไม่มีสมาชิก</td></tr>";
    } else {
      members.forEach(function(m, idx) {
        h += "<tr><td>" + m.no + "</td><td style='font-weight:500'>" + escH(m.name) + "</td><td>" + escH(m.class) + "</td>";
        h += "<td><div class='td-actions'><button class='btn btn-sm' style='color:var(--red-600);border-color:var(--red-100)' id='del_" + idx + "'><i class='ti ti-trash'></i></button></div></td></tr>";
      });
    }
    h += "</tbody></table></div></div></div>";
    showPage(h);

    // Events
    G("memSearch").addEventListener("input", function() {
      var q = this.value.toLowerCase();
      document.querySelectorAll("#memTbl tbody tr").forEach(function(r) {
        r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
      });
    });
    members.forEach(function(m, idx) {
      var btn = G("del_" + idx);
      if (!btn) return;
      btn.addEventListener("click", function() {
        Swal.fire({
          icon:"warning", title:"ลบสมาชิก", text:"นำ " + m.name + " ออกจากชุมนุมนี้?",
          confirmButtonText:"ลบ", confirmButtonColor:"#e53e3e",
          showCancelButton:true, cancelButtonText:"ยกเลิก"
        }).then(function(r) {
          if (!r.isConfirmed) return;
          db.ref("clubs/" + cid + "/members/" + m.id).remove()
            .then(function(){ toast("success","ลบสำเร็จ"); renderMembers(); })
            .catch(function(e){ toast("error","เกิดข้อผิดพลาด",e.message); });
        });
      });
    });

    // Class → Student selector
    if (G("selCls")) {
      G("selCls").addEventListener("change", function() {
        var cls = this.value;
        var sel = G("selStu");
        sel.innerHTML = "<option value=''>-- เลือกนักเรียน --</option>";
        if (!cls) return;
        allStudents.filter(function(s){ return s.class===cls; })
          .sort(function(a,b){ return Number(a.no)-Number(b.no); })
          .forEach(function(s) {
            var already = memberIds[s.id] ? " (เป็นสมาชิกแล้ว)" : "";
            sel.innerHTML += "<option value='" + s.id + "'" + (memberIds[s.id]?" disabled":"") + ">" + s.no + ". " + escH(s.name) + already + "</option>";
          });
      });
    }
    if (G("btnAddFromDB")) {
      G("btnAddFromDB").addEventListener("click", function() {
        var sid = G("selStu").value;
        if (!sid) { toast("warning","กรุณาเลือกนักเรียน"); return; }
        var stu = allStudents.find(function(s){ return s.id===sid; });
        if (!stu) return;
        db.ref("clubs/" + cid + "/members/" + sid).set({ no:stu.no, name:stu.name, class:stu.class })
          .then(function(){ toast("success","เพิ่มสมาชิกสำเร็จ","เพิ่ม " + stu.name + " แล้ว"); renderMembers(); })
          .catch(function(e){ toast("error","เกิดข้อผิดพลาด",e.message); });
      });
    }
  });
}

// ══ ATTENDANCE ══
function renderAttendance() {
  if (!APP.clubId) {
    if (APP.isAdmin) { renderAllClubs(); return; }
    pickClubFirst(); return;
  }
  _cid  = APP.clubId;
  _date = todayKey();
  loadAttendanceData();
}

function loadAttendanceData() {
  showPage("<div class='container'><div class='loading'>กำลังโหลด...</div></div>");
  Promise.all([
    db.ref("clubs/" + _cid + "/members").once("value"),
    db.ref("clubs/" + _cid + "/attendance/" + _date).once("value"),
    db.ref("clubs/" + _cid + "/activities/" + _date).once("value")
  ]).then(function(res) {
    _members = [];
    if (res[0].exists()) res[0].forEach(function(c) {
      var d = c.val(); _members.push({ id:c.key, no:d.no, name:d.name, class:d.class });
    });
    _members.sort(function(a,b){ return String(a.class).localeCompare(String(b.class)) || Number(a.no)-Number(b.no); });
    _att = {};
    if (res[1].exists()) res[1].forEach(function(c){ _att[c.key] = c.val(); });
    var actNote = res[2].exists() ? (res[2].val().note||"") : "";
    buildAttUI(actNote);
  });
}

function buildAttUI(actNote) {
  var cid = _cid, members = _members, att = _att, dateKey = _date;
  var p=0,a=0,l=0,lv=0,n=0;
  members.forEach(function(m){
    var s = att[m.id];
    if(s==="present")p++; else if(s==="absent")a++; else if(s==="late")l++; else if(s==="leave")lv++; else n++;
  });

  var h = "<div class='container'>";
  h += "<div class='section-header'>";
  h += "<div><h2 style='margin:0'>เช็คชื่อ: " + escH(CLUBS[cid].name) + "</h2><div class='text-muted'>" + escH(teacherNames(cid)) + "</div></div>";
  if (APP.isAdmin) h += "<button class='btn btn-sm' id='btnBack'><i class='ti ti-arrow-left'></i> กลับ</button>";
  h += "</div>";

  // วันที่
  h += "<div style='display:flex;align-items:center;gap:.75rem;background:#fff;border:1.5px solid var(--blue-100);border-radius:var(--radius);padding:.75rem 1rem;margin-bottom:1rem;flex-wrap:wrap'>";
  h += "<label style='font-size:13px;font-weight:600;color:var(--gray-600);white-space:nowrap'><i class='ti ti-calendar'></i> วันที่:</label>";
  h += "<input type='date' id='attDate' value='" + dateKey + "' style='width:auto;padding:6px 10px;font-size:13px'>";
  h += "<span id='dateDisp' style='font-size:13px;color:var(--blue-600);font-weight:600'>" + thaiDate(dateKey) + "</span></div>";

  // ช่องรายละเอียดกิจกรรม
  h += "<div class='activity-box'>";
  h += "<label><i class='ti ti-notes'></i> รายละเอียดกิจกรรมวันนี้</label>";
  h += "<div style='display:flex;gap:.5rem'>";
  h += "<input id='actNote' type='text' placeholder='เช่น เรียนรู้เรื่องการแยกขยะ, ฝึกซ้อมดนตรี...' value='" + escH(actNote) + "' style='flex:1'>";
  h += "<button class='btn btn-blue btn-sm' id='btnSaveAct'><i class='ti ti-device-floppy'></i> บันทึก</button>";
  h += "</div></div>";

  // Stats
  h += "<div class='stat-row'>";
  h += "<div class='stat-box'><div class='stat-num'>" + members.length + "</div><div class='stat-label'>ทั้งหมด</div></div>";
  h += "<div class='stat-box'><div class='stat-num' style='color:var(--green-600)'>" + p + "</div><div class='stat-label'>มาเรียน</div></div>";
  h += "<div class='stat-box'><div class='stat-num' style='color:var(--red-600)'>" + a + "</div><div class='stat-label'>ขาด</div></div>";
  h += "<div class='stat-box'><div class='stat-num' style='color:var(--orange-600)'>" + l + "</div><div class='stat-label'>มาสาย</div></div>";
  h += "<div class='stat-box'><div class='stat-num' style='color:var(--yellow-800)'>" + lv + "</div><div class='stat-label'>ลา</div></div>";
  h += "<div class='stat-box'><div class='stat-num' style='color:var(--gray-400)'>" + n + "</div><div class='stat-label'>ยังไม่เช็ค</div></div>";
  h += "</div>";
  h += "<div style='display:flex;gap:.5rem;margin-bottom:1rem;flex-wrap:wrap'>";
  h += "<button class='btn btn-green btn-sm' id='btnAllPresent'><i class='ti ti-check-all'></i> มาทั้งหมด</button>";
  h += "</div>";
  h += "<div class='search-box' style='margin-bottom:1rem'><i class='ti ti-search'></i><input id='attSearch' placeholder='ค้นหาชื่อ...'></div>";
  h += "<div class='card' style='padding:0'><div class='table-wrap'><table id='attTbl'>";
  h += "<thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th>สถานะ</th><th style='text-align:center'>เช็คชื่อ</th></tr></thead><tbody>";
  members.forEach(function(m, idx) {
    var s = att[m.id] || "";
    h += "<tr id='arow_" + idx + "'><td>" + m.no + "</td><td style='font-weight:500'>" + escH(m.name) + "</td><td>" + escH(m.class) + "</td>";
    h += "<td id='abadge_" + idx + "'>" + stBadge(s) + "</td>";
    h += "<td><div style='display:flex;gap:4px;justify-content:center;flex-wrap:wrap'>";
    ST_LIST.forEach(function(sv) {
      h += "<button class='status-btn" + (s===sv?" "+ST_CLS[sv]:"") + "' id='sbtn_" + idx + "_" + sv + "'>" + ST_LABEL[sv] + "</button>";
    });
    h += "</div></td></tr>";
  });
  h += "</tbody></table></div></div></div>";
  showPage(h);

  // ── Events ──
  if (G("btnBack")) G("btnBack").addEventListener("click", function(){ renderAllClubs(); });

  G("attDate").addEventListener("change", function() {
    _date = this.value;
    G("dateDisp").textContent = thaiDate(this.value);
    db.ref("clubs/" + cid + "/attendance/" + this.value).once("value").then(function(aSnap) {
      _att = {};
      if (aSnap.exists()) aSnap.forEach(function(c){ _att[c.key] = c.val(); });
      db.ref("clubs/" + cid + "/activities/" + _date).once("value").then(function(actSnap) {
        var note = actSnap.exists() ? (actSnap.val().note||"") : "";
        buildAttUI(note);
      });
    });
  });

  G("btnSaveAct").addEventListener("click", function() {
    var note = G("actNote").value.trim();
    db.ref("clubs/" + cid + "/activities/" + _date).set({ note:note, savedBy:APP.displayName })
      .then(function(){ toast("success","บันทึกรายละเอียดกิจกรรมแล้ว"); })
      .catch(function(e){ toast("error","เกิดข้อผิดพลาด",e.message); });
  });

  G("attSearch").addEventListener("input", function() {
    var q = this.value.toLowerCase();
    document.querySelectorAll("#attTbl tbody tr").forEach(function(r) {
      r.style.display = r.textContent.toLowerCase().includes(q) ? "" : "none";
    });
  });

  G("btnAllPresent").addEventListener("click", function() {
    var updates = {};
    _members.forEach(function(m){ updates["clubs/" + cid + "/attendance/" + _date + "/" + m.id] = "present"; });
    db.ref().update(updates).then(function() {
      _members.forEach(function(m){ _att[m.id] = "present"; });
      toast("success","บันทึกสำเร็จ","ทำเครื่องหมายมาทั้งหมดแล้ว");
      buildAttUI(G("actNote").value.trim());
    }).catch(function(e){ toast("error","เกิดข้อผิดพลาด",e.message); });
  });

  members.forEach(function(m, idx) {
    ST_LIST.forEach(function(sv) {
      var btn = G("sbtn_" + idx + "_" + sv);
      if (!btn) return;
      btn.addEventListener("click", function() {
        db.ref("clubs/" + cid + "/attendance/" + _date + "/" + m.id).set(sv).then(function() {
          _att[m.id] = sv;
          G("abadge_" + idx).innerHTML = stBadge(sv);
          ST_LIST.forEach(function(sv2) {
            var b = G("sbtn_" + idx + "_" + sv2);
            if (b) b.className = "status-btn" + (sv2===sv ? " "+ST_CLS[sv2] : "");
          });
        }).catch(function(e){ toast("error","บันทึกไม่สำเร็จ",e.message); });
      });
    });
  });
}

// ══ REPORT ══
function renderReport() {
  if (!APP.clubId) { pickClubFirst(); return; }
  var cid = APP.clubId;
  showPage("<div class='container'><div class='loading'>กำลังโหลด...</div></div>");
  Promise.all([
    db.ref("clubs/" + cid + "/members").once("value"),
    db.ref("clubs/" + cid + "/attendance").once("value"),
    db.ref("clubs/" + cid + "/activities").once("value")
  ]).then(function(res) {
    var members = [];
    if (res[0].exists()) res[0].forEach(function(c) {
      var d = c.val(); members.push({ id:c.key, no:d.no, name:d.name, class:d.class });
    });
    members.sort(function(a,b){ return String(a.class).localeCompare(String(b.class))||Number(a.no)-Number(b.no); });

    var allAtt = {};
    if (res[1].exists()) res[1].forEach(function(dn) {
      allAtt[dn.key] = {};
      dn.forEach(function(c){ allAtt[dn.key][c.key] = c.val(); });
    });

    var activities = {};
    if (res[2].exists()) res[2].forEach(function(c){ activities[c.key] = c.val().note||""; });

    var dates = Object.keys(allAtt).sort();
    window._rptData = { cid, members, dates, allAtt, activities };

    var h = "<div class='container'>";
    h += "<div class='section-header'><div><h2 style='margin:0'>รายงาน: " + escH(CLUBS[cid].name) + "</h2>";
    h += "<div class='text-muted'>" + dates.length + " ครั้ง · " + members.length + " คน</div></div>";
    h += "<div style='display:flex;gap:.5rem;flex-wrap:wrap'>";
    h += "<button class='btn btn-yellow' id='btnRptPDF'><i class='ti ti-file-type-pdf'></i> PDF</button>";
    h += "<button class='btn' id='btnRptCSV'><i class='ti ti-download'></i> CSV</button>";
    h += "</div></div>";

    if (!members.length) { h += "<div class='empty'>ยังไม่มีสมาชิก</div></div>"; showPage(h); return; }

    // Summary table
    h += "<div class='card' style='padding:0;margin-bottom:1rem'><div class='table-wrap'><table>";
    h += "<thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th style='color:var(--green-600)'>มา</th><th style='color:var(--red-600)'>ขาด</th><th style='color:var(--orange-600)'>สาย</th><th style='color:var(--yellow-800)'>ลา</th></tr></thead><tbody>";
    members.forEach(function(m) {
      var p=0,a=0,l=0,lv=0;
      dates.forEach(function(dk) {
        var s=(allAtt[dk]||{})[m.id];
        if(s==="present")p++; else if(s==="absent")a++; else if(s==="late")l++; else if(s==="leave")lv++;
      });
      h += "<tr><td>" + m.no + "</td><td style='font-weight:500'>" + escH(m.name) + "</td><td>" + escH(m.class) + "</td>";
      h += "<td><span class='badge badge-green'>" + p + "</span></td><td><span class='badge badge-red'>" + a + "</span></td>";
      h += "<td><span class='badge badge-orange'>" + l + "</span></td><td><span class='badge badge-yellow'>" + lv + "</span></td></tr>";
    });
    h += "</tbody></table></div></div>";

    if (dates.length) {
      h += "<div class='card'><h3>รายละเอียดตามวันที่</h3><div class='tab-bar'>";
      dates.forEach(function(dk, i) {
        h += "<button class='tbtn" + (i===0?" active":"") + "' id='rtab_" + i + "'>" + thaiDate(dk) + "</button>";
      });
      h += "</div>";
      dates.forEach(function(dk, i) {
        var actNote = activities[dk] || "";
        h += "<div class='tc" + (i===0?" active":"") + "' id='rtc_" + i + "'>";
        if (actNote) h += "<div style='background:var(--blue-50);border-left:4px solid var(--blue-400);padding:.5rem .75rem;margin-bottom:.75rem;font-size:13px;border-radius:6px'><i class='ti ti-notes'></i> <strong>กิจกรรม:</strong> " + escH(actNote) + "</div>";
        h += "<div class='table-wrap'><table><thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th>สถานะ</th></tr></thead><tbody>";
        members.forEach(function(m) {
          var s = (allAtt[dk]||{})[m.id] || "";
          h += "<tr><td>" + m.no + "</td><td>" + escH(m.name) + "</td><td>" + escH(m.class) + "</td><td>" + stBadge(s) + "</td></tr>";
        });
        h += "</tbody></table></div></div>";
      });
      h += "</div>";
    }
    h += "</div>";
    showPage(h);

    G("btnRptPDF").addEventListener("click", doExportPDF);
    G("btnRptCSV").addEventListener("click", doExportCSV);
    dates.forEach(function(dk, i) {
      var btn = G("rtab_" + i);
      if (!btn) return;
      btn.addEventListener("click", function() {
        document.querySelectorAll(".tbtn").forEach(function(b){ b.classList.remove("active"); });
        document.querySelectorAll(".tc").forEach(function(t){ t.classList.remove("active"); });
        btn.classList.add("active");
        G("rtc_" + i).classList.add("active");
      });
    });
  });
}

function doExportPDF() {
  var d = window._rptData; if (!d) return;
  var win = window.open("","_blank");
  var h = "<!DOCTYPE html><html lang='th'><head><meta charset='UTF-8'>" +
    "<link href='https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&display=swap' rel='stylesheet'>" +
    "<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Sarabun,sans-serif;font-size:12px;padding:16px}" +
    ".hdr{text-align:center;border-bottom:2px solid #2980b9;padding-bottom:10px;margin-bottom:16px}" +
    ".hdr h1{font-size:16px;font-weight:700;color:#2980b9}.hdr p{font-size:11px;color:#555;margin-top:3px}" +
    "table{width:100%;border-collapse:collapse;font-size:11px;margin-bottom:16px}" +
    "thead th{background:#2980b9;color:#fff;padding:6px 8px;text-align:left}" +
    "tbody td{padding:5px 8px;border-bottom:1px solid #ddd}" +
    "tbody tr:nth-child(even){background:#f5f9ff}" +
    ".sec{font-size:13px;font-weight:700;color:#2980b9;margin:12px 0 6px;padding:4px 8px;background:#e8f4fd;border-left:4px solid #2980b9}" +
    ".act{font-size:11px;color:#475569;padding:3px 8px;margin-bottom:6px;border-left:3px solid #4dadd0;background:#f0f8fc}" +
    ".g{color:#1d6b45;font-weight:600}.r{color:#e53e3e;font-weight:600}.o{color:#e65c00;font-weight:600}.y{color:#7a5c00;font-weight:600}" +
    ".footer{text-align:center;margin-top:16px;font-size:10px;color:#888;border-top:1px solid #ddd;padding-top:8px}" +
    "@media print{button{display:none}}</style></head><body>";
  h += "<div class='hdr'><h1>รายงานการเช็คชื่อกิจกรรมชุมนุม</h1>";
  h += "<p>ชุมนุม: " + CLUBS[d.cid].name + " | โรงเรียนบ้านสวนวิทยาคม ภาคเรียนที่ 1/2569</p>";
  h += "<p>วันที่พิมพ์: " + new Date().toLocaleDateString("th-TH",{year:"numeric",month:"long",day:"numeric"}) + "</p></div>";
  h += "<div class='sec'>สรุปรายคน</div>";
  h += "<table><thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th>มาเรียน</th><th>ขาด</th><th>มาสาย</th><th>ลา</th></tr></thead><tbody>";
  d.members.forEach(function(m) {
    var p=0,a=0,l=0,lv=0;
    d.dates.forEach(function(dk){ var s=(d.allAtt[dk]||{})[m.id]; if(s==="present")p++;else if(s==="absent")a++;else if(s==="late")l++;else if(s==="leave")lv++; });
    h += "<tr><td>" + m.no + "</td><td>" + m.name + "</td><td>" + m.class + "</td><td class='g'>" + p + "</td><td class='r'>" + a + "</td><td class='o'>" + l + "</td><td class='y'>" + lv + "</td></tr>";
  });
  h += "</tbody></table>";
  d.dates.forEach(function(dk) {
    h += "<div class='sec'>" + thaiDate(dk) + "</div>";
    if (d.activities[dk]) h += "<div class='act'>กิจกรรม: " + d.activities[dk] + "</div>";
    h += "<table><thead><tr><th>เลขที่</th><th>ชื่อ-นามสกุล</th><th>ห้อง</th><th>สถานะ</th></tr></thead><tbody>";
    d.members.forEach(function(m) {
      var s=(d.allAtt[dk]||{})[m.id]||"";
      var lbl=ST_LABEL[s]||"-", cls=s==="present"?"g":s==="absent"?"r":s==="late"?"o":s==="leave"?"y":"";
      h += "<tr><td>" + m.no + "</td><td>" + m.name + "</td><td>" + m.class + "</td><td class='" + cls + "'>" + lbl + "</td></tr>";
    });
    h += "</tbody></table>";
  });
  h += "<div class='footer'>Copyright &copy; 2026 ระบบบันทึกกิจกรรมชุมนุม | โรงเรียนบ้านสวนวิทยาคม</div>";
  h += "<br><div style='text-align:center'><button onclick='window.print()' style='padding:8px 24px;background:#2980b9;color:#fff;border:none;border-radius:8px;font-size:14px;font-family:Sarabun;cursor:pointer'>🖨️ พิมพ์ / บันทึก PDF</button></div>";
  h += "</body></html>";
  win.document.write(h); win.document.close();
}

function doExportCSV() {
  var d = window._rptData; if (!d) return;
  var csv = "\uFEFF" + "เลขที่,ชื่อ-นามสกุล,ห้อง";
  d.dates.forEach(function(dk){ csv += "," + thaiDate(dk); });
  csv += ",มาเรียน,ขาด,มาสาย,ลา\n";
  d.members.forEach(function(m) {
    csv += m.no + ',"' + m.name + '",' + m.class;
    var p=0,a=0,l=0,lv=0;
    d.dates.forEach(function(dk){
      var s=(d.allAtt[dk]||{})[m.id]||"";
      csv += "," + (ST_LABEL[s]||"-");
      if(s==="present")p++;else if(s==="absent")a++;else if(s==="late")l++;else if(s==="leave")lv++;
    });
    csv += "," + p + "," + a + "," + l + "," + lv + "\n";
  });
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download = "เช็คชื่อ_" + CLUBS[d.cid].name + ".csv";
  a.click();
}
